<!doctype html><html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Temporary task access test</title><body><h1>Task access test</h1><label>Email <input id="email" type="email" value="qwpsr2@mail.instinct.com"></label><label>Password <input id="password" type="password"></label><button id="signin">Sign in</button><button id="probe" disabled>Run denied/read probes</button><pre id="out"></pre><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://svkbvwstixwyejlcgyxd.supabase.co','sb_publishable_sEG6X5medgB4xgg20JYiVA_lLzN3-oD');const out=document.getElementById('out');
document.getElementById('signin').onclick=async()=>{let {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});document.getElementById('password').value='';out.textContent=error?'Sign-in error: '+error.message:'Signed in as '+data.user.email;document.getElementById('probe').disabled=!!error;};
const url='https://svkbvwstixwyejlcgyxd.supabase.co/rest/v1/';
async function call(label,path,method='GET',body){const {data:{session}}=await sb.auth.getSession();const r=await fetch(url+path,{method,headers:{apikey:'sb_publishable_sEG6X5medgB4xgg20JYiVA_lLzN3-oD',Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'return=minimal'},body:body?JSON.stringify(body):undefined});out.textContent+='\n'+label+': '+r.status+' '+(await r.text()).slice(0,350);}
document.getElementById('probe').onclick=async()=>{out.textContent+='\nProbes:';await call('own-source SELECT','shop_task_feed?select=title,source&source=eq.renen_instinct');await call('cross-source SELECT','shop_task_feed?select=title,source&source=eq.sraya_instinct');await call('ops_items SELECT','ops_items?select=id,title&limit=1');await call('cross-source INSERT','shop_task_feed','POST',{source:'sraya_instinct',source_task_id:'DENIED-PROBE-NO-ROW',title:'DENIED TEST',status:'open',person:'Test'});await call('system-field INSERT','shop_task_feed','POST',{source:'renen_instinct',source_task_id:'DENIED-SYSFIELD-NO-ROW',title:'DENIED TEST',status:'open',person:'Test',created_at:'2000-01-01T00:00:00Z'});await call('extra-field INSERT','shop_task_feed','POST',{source:'renen_instinct',source_task_id:'DENIED-EXTRA-NO-ROW',title:'DENIED TEST',status:'open',person:'Test',private_notes:'DENIED TEST'});await sb.auth.signOut();out.textContent+='\nSigned out';document.getElementById('probe').disabled=true;};
</script></body></html>
